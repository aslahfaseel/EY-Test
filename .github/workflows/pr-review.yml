name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Get PR Diff
        id: pr_diff
        run: |
          diff_content=$(git diff origin/${{ github.base_ref }}...HEAD)

          if [ -z "$diff_content" ]; then
            diff_content="No code changes detected in this pull request."
          fi

          delimiter=$(openssl rand -hex 16)
          printf "diff<<%s\n%s\n%s\n" "$delimiter" "$diff_content" "$delimiter" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Gemini CLI
        run: |
          npm install -g @google/gemini-cli
          gemini --version

      - name: Configure Gemini Auth
        run: |
          mkdir -p ~/.gemini
          echo '{"selectedAuthType":"gemini-api-key"}' > ~/.gemini/settings.json

      - name: Run Gemini Review
        id: gemini_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_DIFF: ${{ steps.pr_diff.outputs.diff }}
        run: |
          printf "You are a senior engineer reviewing a PR.\n\nCode changes:\n\n" > prompt.txt
          echo "$PR_DIFF" >> prompt.txt

          prompt=$(cat prompt.txt)

          gemini -p "$prompt" > review_output.txt

          delimiter=$(openssl rand -hex 16)
          printf "review<<%s\n%s\n%s\n" "$delimiter" "$(cat review_output.txt)" "$delimiter" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_OUTPUT: ${{ steps.gemini_review.outputs.review }}
        run: |
          printf "### 🤖 Gemini AI Code Review\n\n%s\n" "$REVIEW_OUTPUT" > review_comment.md
          gh pr comment $PR_NUMBER --body-file review_comment.md