name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Get PR Diff
        id: pr_diff
        run: |
          diff_content=$(git diff origin/${{ github.base_ref }}...HEAD)

          if [ -z "$diff_content" ]; then
            diff_content="No code changes detected in this pull request."
          fi

          diff_size=${#diff_content}
          echo "Diff size: $diff_size characters"

          if [ $diff_size -gt 500000 ]; then
            echo "Large PR detected. Truncating diff."
            diff_content=$(echo "$diff_content" | head -c 500000)
          fi

          DELIMITER=$(openssl rand -hex 16)

          printf "diff<<%s\n%s\n%s\n" "$DELIMITER" "$diff_content" "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Gemini CLI
        run: |
          npm install -g @google/gemini-cli
          gemini --version

      - name: Install GitHub CLI
        run: |
          gh --version

      - name: Run Gemini Review
        id: gemini_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_DIFF: ${{ steps.pr_diff.outputs.diff }}
        run: |
          echo "Creating review prompt..."

          cat <<EOF > review_prompt.txt


               Review the following code changes and identify:

               1. Bugs or logic errors
                ELIMITER" "$(cat review_output.txt)" "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_OUTPUT: ${{ steps.gemini_review.outputs.review }}
        run: |
          echo "Posting PR comment..."

          cat <<EOF > review_comment.md
### 🤖 Gemini AI Code Review


                                      
